<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<header>
    <nav class="navbar bg-body-tertiary bg-warning-subtle">
  <div class="container-fluid d-flex justify-content-center">
    <h1 class="text-warning">Formulário de Login</h1>
</div>
</nav>
</header>

<body>


    <form id="formLogin" class="d-flex justify-content-center">
        <div class="w-25 p-3">
            
            <div class="p-3 mb-2 bg-warning-subtle text-warning-emphasis border border-warning-subtle rounded border-3">
            
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control border border-warning-subtle rounded border-2" id="email" aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text">O seu E-mail não será compartilhado!</div>
            </div>
           

            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control border border-warning-subtle rounded border-2" id="senha">
            </div>

            <p class="form-text">Esqueci minha senha</p>

            <button type="submit" class="btn btn-light border border-warning-subtle border-2">Login</button>
        </div>
      
        </div>
    </form>



</body>

</html>
